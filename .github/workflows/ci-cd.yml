name: CivicFix CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================================
  # Job 1: Backend CI Testing & Validation
  # ============================================================================
  backend-test:
    name: Backend CI (Pytest & Lint)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: civicfix_test_db
          POSTGRES_USER: civicfix_user
          POSTGRES_PASSWORD: civicfix_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .[dev]

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: testing
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: civicfix_test_db
          POSTGRES_USER: civicfix_user
          POSTGRES_PASSWORD: civicfix_test_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET_KEY: test_jwt_secret_key_12345
        run: |
          pytest -v --junitxml=junit.xml

  # ============================================================================
  # Job 2: Frontend CI Build & Type Check
  # ============================================================================
  frontend-build:
    name: Frontend CI (TypeScript & Vite Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Web Bundle
        working-directory: ./frontend
        run: npm run build

  # ============================================================================
  # Job 3: Continuous Deployment (CD - Docker Build & Remote Server Trigger)
  # ============================================================================
  deploy:
    name: CD Deployment Pipeline
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & Push API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/civicfix-api:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/civicfix-api:${{ github.sha }}

      - name: Build & Push Nginx Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/civicfix-nginx:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/civicfix-nginx:${{ github.sha }}

      - name: Trigger Remote Production Server Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_SERVER_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USER }}
          key: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/civicfix
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
